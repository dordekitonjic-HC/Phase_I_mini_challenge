---
- name: Set timezone to Europe/Berlin
  become: true
  community.general.timezone:
    name: Europe/Berlin

- name: Comment out Include directive for sshd_config.d to prevent overrides
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^Include /etc/ssh/sshd_config.d/\\*.conf"
    line: "#Include /etc/ssh/sshd_config.d/*.conf"
    state: present

- name: Set authorized key taken from file
  ansible.posix.authorized_key:
    user: vagrant
    state: present
    key: "{{ lookup('file', '/home/dorde/.ssh/id_ed25519.pub') }}"

- name: Changing standard SSH port to 3333.
  ansible.builtin.lineinfile:
    path=/etc/ssh/sshd_config
    regexp="^Port"
    line="Port 3333"
    state=present

- name: Disable root SSH access.
  ansible.builtin.lineinfile:
    path=/etc/ssh/sshd_config
    regexp="^PermitRootLogin"
    line="PermitRootLogin no"
    state=present
  
- name: Disable SSH password authentication.
  ansible.builtin.lineinfile:
    path=/etc/ssh/sshd_config
    regexp="^PasswordAuthentication"
    line="PasswordAuthentication no"
    state=present

- name: Enable SSH Pub-Key authentication.
  ansible.builtin.lineinfile:
    path=/etc/ssh/sshd_config
    regexp="^PubkeyAuthentication"
    line="PubkeyAuthentication yes"
    state=present

- name: Disable SSH keyboard-interactive authentication.
  ansible.builtin.lineinfile:
    path=/etc/ssh/sshd_config
    regexp="^ChallengeResponseAuthentication"
    line="ChallengeResponseAuthentication no"
    state=present

- name: Just force systemd to reread configs (2.4 and above)
  ansible.builtin.systemd:
    daemon_reload: yes
    
- name: Restart service sshd, in all cases
  ansible.builtin.service:
    name: ssh
    state: restarted

