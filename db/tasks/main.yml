---
- name: Pulling and starting postgres
  community.docker.docker_container:
    name: postgres-latest
    image: postgres
    state: started
    pull: true
    restart_policy: unless-stopped
    ports:
      - 5432:5432
    env:
      POSTGRES_USER: "app"
      POSTGRES_DB: "appdb"
      POSTGRES_PASSWORD: !vault |
          $ANSIBLE_VAULT;1.1;AES256
