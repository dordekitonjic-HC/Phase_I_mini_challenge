---
- name: Create a directory if it does not exist
  ansible.builtin.file:
    path: /opt/backend
    state: directory
    mode: '0755'  

- name: Copying backend image from host to backend server
  ansible.builtin.copy:
    src: /home/dorde/git/Phase_I_mini_challenge/docker/backend/backend.tar
    dest: /opt/backend/

- name: Load backend image from archive
  community.docker.docker_image:
    name: docker-backend
    tag: latest
    load_path: /opt/backend/backend.tar
    source: load

- name: Run backend container and publish ports
  community.docker.docker_container:
    name: backend_app
    image: docker-backend:latest
    state: started
    restart_policy: always
    published_ports:
      - "5000:5000"
    env:
      #DB_HOST: "{{ hostvars['db']['ansible_host'] }}"
      DB_HOST: "192.168.56.12"
      DB_NAME: "appdb"
      DB_USER: "app"
      DB_PASSWORD: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36313432386662663933326565393232613737383531633730376634653435656133363935643161
          6130356239336137303562363263626339386365323663390a383639366639393039646337333630
          65646138303235353033373530316632343965636564356137346633343562343137633637306434
          3332313866313438350a383234656363653435623862636132316139373862386466626232353162
